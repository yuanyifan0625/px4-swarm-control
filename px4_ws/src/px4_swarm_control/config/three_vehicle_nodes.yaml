# First-version fixed role/namespace/slot layout for manual ticket 05 checks.
MAV1:
  ros__parameters:
    role: leader
    vehicle_id: MAV1
    px4_namespace: /MAV1
    px4_target_system: 1
    slot: leader
    control_loop_hz: 50.0
    status_loop_hz: 50.0
    telemetry_timeout_s: 0.5
    following_vee_lateral_spacing_m: 1.0
    following_vee_trail_spacing_m: 1.0
    following_line_abreast_lateral_spacing_m: 1.0
    safety_minimum_horizontal_distance_m: 0.7
    safety_transition_duration_s: 1.0
    safety_fallback_step_m: 0.3
    hold_x: 0.0
    hold_y: 0.0
    hold_z: -1.0
    hold_yaw: 0.0

